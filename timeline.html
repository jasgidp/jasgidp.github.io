<!DOCTYPE html>
<!--
  ============================================================
  PÁGINA TRAYECTORIA / CRONOLOGÍA (timeline.html)
  ------------------------------------------------------------
  ¿Qué es?  Línea de tiempo de experiencia, investigación,
            liderazgo y educación.
  ¿Para qué? Ver tu carrera ordenada por fechas, con buscador
             y pestañas por sección. Datos en data/timeline.json
             (timeline.js los dibuja).
  ============================================================
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="edge">
  <title>Trayectoria — Jonathan Sandoval</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Trayectoria profesional y académica de Jonathan Sandoval: experiencia, investigación, liderazgo y educación.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Trayectoria — Jonathan Sandoval">
  <meta property="og:description" content="Experiencia, investigación, liderazgo y educación.">
  <meta property="og:url" content="https://jasgidp.github.io/timeline.html">
  <meta property="og:image" content="https://jasgidp.github.io/assets/img/brand/HOme.png">
  <link rel="shortcut icon" href="favicon.png">
  <link rel="stylesheet" href="css/main.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet" />
  <!-- Tema claro/oscuro. SIN "defer": debe aplicarse antes de dibujar
       la pagina para evitar un parpadeo de color al cargar. -->
  <script src="js/theme.js"></script>
</head>
<body>
  <div id="site-header"></div>

  <video class="video-bg" autoplay muted loop playsinline
         poster="assets/img/brand/background-poster.jpg"
         aria-hidden="true" tabindex="-1" disablepictureinpicture>
    <!-- WebM primero: pesa menos. Si el navegador no lo soporta, usa el MP4. -->
    <source src="assets/video/background.webm" type="video/webm">
    <source src="assets/video/background.mp4" type="video/mp4">
  </video>

  <main class="page">
    <h1 data-i18n="timeline.title" class="timeline-title">Timeline</h1>

    <section class="timeline-controls" aria-label="Timeline controls">
      <!-- Buscador de cargos, organizaciones o viñetas -->
      <div class="search-wrap">
        <i class="ri-search-line" aria-hidden="true"></i>
        <input id="timeline-search" type="search" placeholder="Search experience..." aria-label="Search timeline" />
      </div>
      <!-- Pestañas Work / Research / Leadership / Education (las crea timeline.js) -->
      <nav class="tabs" id="timeline-tabs" aria-label="Sections"></nav>
    </section>

    <!-- Contenedor vacío: timeline.js pinta la lista de entradas aquí -->
    <section id="timeline-container" class="timeline" aria-live="polite"></section>
  </main>

  <script src="js/analytics.js" defer></script>
  <script src="js/header.js" defer></script>
  <script src="js/i18n.js" defer></script>
  <script src="js/timeline.js" defer></script>
  <script src="js/script.js" defer></script>
  <script>
    document.addEventListener('i18n:updated', () => { if (window.applyI18n) window.applyI18n(document); });
  </script>
</body>
</html>
