<!DOCTYPE html>
<!--
  ============================================================
  PÁGINA PORTAFOLIO (portfolio.html)
  ------------------------------------------------------------
  ¿Qué es?  Galería de proyectos (diseño, ingeniería, software…).
  ¿Para qué? Buscar y filtrar proyectos. Al hacer clic en una
             tarjeta se abre un panel con todos los detalles.
             Los proyectos viven en data/projects.json y
             projects.js los dibuja en #projects-container.
  ============================================================
-->
<html lang="en">
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Portafolio — Jonathan Sandoval</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <meta name="description" content="Portafolio de proyectos de Jonathan Sandoval: ingeniería, software, diseño gráfico, experiencia e investigación.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Portafolio — Jonathan Sandoval">
    <meta property="og:description" content="Proyectos de ingeniería, software, diseño gráfico, experiencia e investigación.">
    <meta property="og:url" content="https://jasgidp.github.io/portfolio.html">
    <meta property="og:image" content="https://jasgidp.github.io/assets/img/brand/HOme.png">
    <link rel="shortcut icon" href="favicon.png">
    <link rel='stylesheet' type='text/css' media='screen' href='css/main.css'>

    <!-- Iconos Remix Icon -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet" />

    <!-- Fuentes Google (Montserrat + Open Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet">

  <!-- Tema claro/oscuro. SIN "defer": debe aplicarse antes de dibujar
       la pagina para evitar un parpadeo de color al cargar. -->
  <script src="js/theme.js"></script>
</head>
<body>
  <!-- Menú compartido -->
  <div id="site-header"></div>

  <!-- Video de fondo -->
  <video class="video-bg" autoplay muted loop playsinline
         poster="assets/img/brand/background-poster.jpg"
         aria-hidden="true" tabindex="-1" disablepictureinpicture>
    <!-- WebM primero: pesa menos. Si el navegador no lo soporta, usa el MP4. -->
    <source src="assets/video/background.webm" type="video/webm">
    <source src="assets/video/background.mp4" type="video/mp4">
  </video>

  <main class="page">
    <h1 data-i18n="portfolio.title" class="timeline-title">Portfolio</h1>

    <!-- Controles: buscador + filtros por categoría -->
    <section class="timeline-controls" aria-label="Portfolio controls">
      <!-- Buscador: projects.js escucha lo que escribes y filtra -->
      <div class="search-wrap">
        <i class="ri-search-line" aria-hidden="true"></i>
        <input id="timeline-search" type="search" placeholder="Search projects..." aria-label="Search projects" />
      </div>

      <!--
        Filtros: cada botón tiene data-filter="categoría".
        projects.js marca el activo y muestra solo esa categoría.
      -->
      <nav class="filters group-chips" aria-label="Project filters">
        <button class="chip active" data-filter="all"><i class="ri-apps-2-line" aria-hidden="true"></i><span data-i18n="filters.all">All</span></button>
        <button class="chip" data-filter="graphic"><i class="ri-brush-line" aria-hidden="true"></i><span data-i18n="filters.graphic">Graphic Design</span></button>
        <button class="chip" data-filter="experience"><i class="ri-layout-2-line" aria-hidden="true"></i><span data-i18n="filters.experience">Experience Design</span></button>
        <button class="chip" data-filter="engineering"><i class="ri-tools-line" aria-hidden="true"></i><span data-i18n="filters.engineering">Engineering</span></button>
        <button class="chip" data-filter="research"><i class="ri-flask-line" aria-hidden="true"></i><span data-i18n="filters.research">Research</span></button>
        <button class="chip" data-filter="software"><i class="ri-code-box-line" aria-hidden="true"></i><span data-i18n="filters.software">Software</span></button>
        <button class="chip" data-filter="design"><i class="ri-shape-2-line" aria-hidden="true"></i><span data-i18n="filters.design">Design</span></button>
      </nav>

      <!-- Aviso que aparece cuando eliges el filtro "software" -->
      <p id="software-hint" class="hint" hidden>
        <i class="ri-information-line" aria-hidden="true"></i>
        <span data-i18n="portfolio.softwareHint">Extra button for programming portfolio is located below.</span>
      </p>
    </section>

    <!--
      Botón extra hacia programming.html.
      Solo se muestra cuando el filtro activo es "software"
      (projects.js controla el atributo hidden).
    -->
    <div id="software-extra" class="software-extra" hidden>
      <a href="programming.html" class="btn"><i class="ri-code-s-slash-line" aria-hidden="true"></i><span data-i18n="portfolio.programmingBtn">Programming Portfolio</span></a>
    </div>

    <!--
      Contenedor vacío: projects.js inserta aquí las tarjetas.
      aria-live="polite" avisa a lectores de pantalla cuando cambia.
    -->
    <section>
      <div id="projects-container" class="skills-grid" aria-live="polite"></div>
    </section>
  </main>

  <script src="js/analytics.js" defer></script>
  <script src="js/header.js" defer></script>
  <script src="js/i18n.js" defer></script>
  <!-- Carga y dibuja los proyectos desde data/projects.json -->
  <script src="js/projects.js" defer></script>
  <script src="js/script.js" defer></script>
  <!-- Brillo que sigue al cursor en las tarjetas -->
  <script src="js/interactions.js" defer></script>
  <script>
    document.addEventListener('i18n:updated', () => { if (window.applyI18n) window.applyI18n(document); });
  </script>
</body>
</html>
