<!DOCTYPE html>
<!--
  ============================================================
  PÁGINA PROGRAMACIÓN (programming.html)
  ------------------------------------------------------------
  ¿Qué es?  Portafolio de proyectos de código + repos de GitHub.
  ¿Para qué?
    1) Lista curada (data/code-projects.json) con demos en vivo.
    2) Todos tus repos públicos de GitHub (github-repos.js).
  ============================================================
-->
<html lang="en">
<head>
  <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Programación — Jonathan Sandoval</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <meta name="description" content="Proyectos de software y repositorios de código de Jonathan Sandoval, con demos en vivo y todos los repos públicos de GitHub.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Programación — Jonathan Sandoval">
    <meta property="og:description" content="Proyectos de software con demos en vivo y repositorios de GitHub.">
    <meta property="og:url" content="https://jasgidp.github.io/programming.html">
    <meta property="og:image" content="https://jasgidp.github.io/assets/img/brand/HOme.png">
    <link rel="shortcut icon" href="favicon.png">
    <link rel='stylesheet' type='text/css' media='screen' href='css/main.css'>

    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet">
</head>

<body>

  <div id="site-header"></div>

  <video class="video-bg" autoplay muted loop playsinline
         poster="assets/img/brand/background-poster.jpg"
         aria-hidden="true" tabindex="-1" disablepictureinpicture>
    <!-- WebM primero: pesa menos. Si el navegador no lo soporta, usa el MP4. -->
    <source src="assets/video/background.webm" type="video/webm">
    <source src="assets/video/background.mp4" type="video/mp4">
  </video>

<main class="page">
  <section class="prog-section">
      <h1 class="timeline-title" data-i18n="programming.title">Programming Portfolio</h1>

      <!-- Buscador de proyectos curados (programming.js lo usa) -->
      <section class="timeline-controls" aria-label="Programming controls">
        <div class="search-wrap">
          <i class="ri-search-line" aria-hidden="true"></i>
          <input id="programming-search" type="search" placeholder="Search projects..." aria-label="Search programming projects" />
        </div>
      </section>

      <p class="prog-intro" data-i18n="programming.intro">Selected software projects with live demos and code repositories. Use the button to toggle the live preview.</p>

      <!--
        Lista vacía: programming.js inserta cada proyecto como <li>.
        El botón "Show demo" lo maneja script.js (muestra/oculta el iframe).
      -->
      <ul class="programming-list" aria-live="polite"></ul>

      <!-- Sección automática de repositorios públicos de GitHub -->
      <h2 class="repos-title" data-i18n="programming.reposTitle">Repositorios de GitHub</h2>
      <p class="prog-intro" data-i18n="programming.reposIntro">Todos mis repositorios públicos, actualizados automáticamente desde GitHub.</p>
      <!-- Contenedor vacío: github-repos.js pinta las tarjetas aquí -->
      <div id="github-repos" class="projects-grid" aria-live="polite"></div>
  </section>
</main>

<script src="js/analytics.js" defer></script>
<script src="js/header.js" defer></script>
<script src="js/i18n.js" defer></script>
<!-- Proyectos curados desde code-projects.json -->
<script src="js/programming.js" defer></script>
<!-- Repos públicos desde la API de GitHub -->
<script src="js/github-repos.js" defer></script>
<!-- Toggle del demo iframe + menú móvil -->
<script src="js/script.js" defer></script>
<script>
  document.addEventListener('i18n:updated', () => { if (window.applyI18n) window.applyI18n(document); });
</script>
</body>
</html>
