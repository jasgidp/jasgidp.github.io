<!DOCTYPE html>
<!--
  ============================================================
  PÁGINA HABILIDADES (skills.html)
  ------------------------------------------------------------
  ¿Qué es?  Catálogo de skills agrupadas (lenguajes, herramientas…).
  ¿Para qué? Buscar y filtrar por grupo. Al hacer clic en una
             skill con detalle, se despliega descripción y docs.
             Los datos están en data/skills.json (skills.js).
  ============================================================
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Habilidades — Jonathan Sandoval</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Habilidades de Jonathan Sandoval: programación y datos, desarrollo web, herramientas, diseño y visualización, idiomas y más.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Habilidades — Jonathan Sandoval">
  <meta property="og:description" content="Programación y datos, herramientas, diseño y visualización, idiomas y más.">
  <meta property="og:url" content="https://jasgidp.github.io/skills.html">
  <meta property="og:image" content="https://jasgidp.github.io/assets/img/brand/HOme.png">
  <link rel="shortcut icon" href="favicon.png">
  <link rel="stylesheet" href="css/main.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet" />
</head>
<body>
  <div id="site-header"></div>

  <video autoplay muted loop class="video-bg">
    <source src="assets/video/background.mp4" type="video/mp4">
  </video>

  <main class="skills-page page">
    <h1 data-i18n="skills.title" class="skills-title">Skills</h1>

    <!-- Controles: buscador + chips de grupo (skills.js crea los chips) -->
    <section class="skills-controls" aria-label="Skills controls">
      <div class="search-wrap">
        <i class="ri-search-line" aria-hidden="true"></i>
        <input id="skill-search" type="search" placeholder="Search skills..." aria-label="Search skills" />
      </div>
      <!-- Vacío a propósito: skills.js genera un botón por cada grupo -->
      <nav class="group-chips" id="group-chips" aria-label="Skill groups"></nav>
    </section>

    <!-- Vacío a propósito: skills.js dibuja las tarjetas de habilidades -->
    <section id="skills-container" class="skills-grid" aria-live="polite"></section>
  </main>

  <script src="js/analytics.js" defer></script>
  <script src="js/header.js" defer></script>
  <script src="js/i18n.js" defer></script>
  <script src="js/skills.js" defer></script>
  <script src="js/script.js" defer></script>
</body>
</html>
